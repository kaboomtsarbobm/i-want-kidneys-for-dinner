[project]
name = "dandys-shops"
version = "0.2.0"
description = "Configurable DandysDEX shops, events, holiday stores, and catch rewards"
requires-python = ">=3.12"
dependencies = ["discord.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dandys_shops"]
